<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mausritter 战役层骰子工具</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#fff; color:#1a1a1a; padding:10px; }
.container { max-width:1100px; margin:0 auto; }
.tabs { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
.tab { padding:6px 16px; background:#f2f2f2; border:1px solid #ddd; border-radius:4px; cursor:pointer; font-size:0.88rem; color:#555; }
.tab:hover { background:#e8e8e8; }
.tab.active { background:#2a2a2a; color:#fff; border-color:#2a2a2a; }
.panel { display:none; }
.panel.active { display:block; }
.section { background:#f7f7f7; border:1px solid #e0e0e0; border-radius:4px; padding:12px; margin-bottom:10px; }
.section h3 { font-size:0.9rem; margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid #dcdcdc; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:6px; }
.label { min-width:90px; font-size:0.85rem; color:#555; }
.die { font-weight:700; min-width:70px; text-align:center; background:#fff; border:1px solid #ddd; border-radius:4px; padding:5px 8px; font-size:0.88rem; }
.lookup { font-size:0.83rem; color:#333; flex:1; min-width:180px; }
.btn { background:#2a2a2a; color:#fff; border:0; border-radius:4px; padding:6px 14px; font-size:0.88rem; cursor:pointer; }
.btn:hover { background:#444; }
.btn.ghost { background:#fff; color:#2a2a2a; border:1px solid #bbb; }
.btn.ghost:hover { background:#eee; }
.input-group { display:flex; gap:6px; align-items:center; }
.input-group input { width:56px; padding:5px; background:#fff; border:1px solid #ccc; border-radius:4px; text-align:center; }
.input-group label { font-size:0.83rem; color:#555; }
.radio-row { display:flex; gap:12px; align-items:center; font-size:0.85rem; margin-bottom:8px; }
.radio-row label { display:flex; gap:4px; align-items:center; cursor:pointer; }
.output { background:#f5f5f5; border:1px solid #ddd; border-radius:4px; padding:10px; margin-top:10px; white-space:pre-wrap; font-family:monospace; font-size:0.85rem; line-height:1.6; max-height:400px; overflow-y:auto; }
.copy { margin-top:8px; }
</style>
</head>
<body>
<div class="container">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('hex')">六角格</div>
    <div class="tab" onclick="switchTab('settle')">定居点</div>
    <div class="tab" onclick="switchTab('season')">季节与流言</div>
    <div class="tab" onclick="switchTab('hook')">起始钩子</div>
  </div>

  <!-- 六角格 -->
  <div id="panel-hex" class="panel active">
    <div class="section">
      <h3>六角格生成</h3>
      <div class="row">
        <div class="input-group">
          <label>格子数</label>
          <input type="number" id="hex-count" value="5" min="1" max="25">
        </div>
        <button class="btn" onclick="rollHexes()">生成格子</button>
        <span class="lookup">每格：类型 + 地标 + 细节</span>
      </div>
      <div class="row" style="margin-top:8px">
        <span class="label">单格掷骰</span>
        <button class="btn ghost" onclick="rollHex()">d6+d20+d6+d8</button>
        <span class="die" id="h-type">-</span>
        <span class="die" id="h-land">-</span>
        <span class="lookup" id="h-detail">-</span>
      </div>
    </div>
    <div class="output" id="hex-output">点击生成</div>
    <button class="btn copy" onclick="copyOutput('hex-output')">复制结果</button>
  </div>

  <!-- 定居点 -->
  <div id="panel-settle" class="panel">
    <div class="section">
      <h3>定居点一键生成</h3>
      <button class="btn" onclick="rollSettlement()">生成定居点</button>
      <div class="row" style="margin-top:10px">
        <span class="label">规模</span>
        <span class="die" id="s-scale">-</span>
        <span class="lookup" id="l-scale">2d6 取低</span>
      </div>
      <div class="row">
        <span class="label">治理</span>
        <span class="die" id="s-gov">-</span>
        <span class="lookup" id="l-gov">d6+规模</span>
      </div>
      <div class="row">
        <span class="label">居民习俗</span>
        <span class="die" id="s-custom">-</span>
        <span class="lookup" id="l-custom">d20</span>
      </div>
      <div class="row">
        <span class="label">显著特征</span>
        <span class="die" id="s-feature">-</span>
        <span class="lookup" id="l-feature">d20（城市两个）</span>
      </div>
      <div class="row">
        <span class="label">产业</span>
        <span class="die" id="s-industry">-</span>
        <span class="lookup" id="l-industry">d20（城镇/城市两个）</span>
      </div>
      <div class="row">
        <span class="label">当前事件</span>
        <span class="die" id="s-event">-</span>
        <span class="lookup" id="l-event">d20</span>
      </div>
      <div class="row">
        <span class="label">命名</span>
        <span class="die" id="s-name">-</span>
        <span class="lookup" id="l-name">前缀+后缀</span>
      </div>
      <div class="row">
        <span class="label">酒馆</span>
        <span class="die" id="s-tavern">-</span>
        <span class="lookup" id="l-tavern">d12×3</span>
      </div>
    </div>
    <div class="output" id="settle-output">点击生成</div>
    <button class="btn copy" onclick="copyOutput('settle-output')">复制结果</button>
  </div>

  <!-- 季节与流言 -->
  <div id="panel-season" class="panel">
    <div class="section">
      <h3>季节天气与事件</h3>
      <div class="radio-row">
        <label><input type="radio" name="season" value="spring" checked>春</label>
        <label><input type="radio" name="season" value="summer">夏</label>
        <label><input type="radio" name="season" value="autumn">秋</label>
        <label><input type="radio" name="season" value="winter">冬</label>
        <button class="btn" onclick="rollSeason()">掷天气</button>
      </div>
      <div class="row">
        <span class="label">天气 2d6</span>
        <span class="die" id="w-dice">-</span>
        <span class="lookup" id="w-weather">-</span>
      </div>
      <div class="row">
        <span class="label">季节事件</span>
        <button class="btn ghost" onclick="rollSeasonEvent()">d6</button>
        <span class="die" id="w-event">-</span>
        <span class="lookup" id="l-event2">d6</span>
      </div>
      <div class="hint" style="font-size:0.8rem;color:#888">恶劣天气旅行需 STR 豁免，否则疲惫</div>
    </div>
    <div class="section">
      <h3>流言真实度</h3>
      <div class="row">
        <span class="label">流言 d6</span>
        <button class="btn ghost" onclick="rollRumor()">d6</button>
        <span class="die" id="r-dice">-</span>
        <span class="lookup" id="r-text">d6</span>
      </div>
    </div>
  </div>

  <!-- 起始钩子 -->
  <div id="panel-hook" class="panel">
    <div class="section">
      <h3>冒险地点起始钩子</h3>
      <div class="row">
        <span class="label">钩子 d6</span>
        <button class="btn ghost" onclick="rollHook()">d6</button>
        <span class="die" id="k-dice">-</span>
        <span class="lookup" id="k-text">d6</span>
      </div>
      <div class="output" id="hook-output" style="margin-top:10px">点击掷骰</div>
      <button class="btn copy" onclick="copyOutput('hook-output')">复制结果</button>
    </div>
  </div>
</div>

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  event.target.classList.add('active');
  $('panel-'+name).classList.add('active');
}

// 六角格
function rollHex(){
  const tr = roll(6), type = T.type[tr-1];
  const lr = roll(20), land = T.land[tr>=6?3:Math.floor((tr-1)/2)][lr-1];
  const d1 = roll(6), d2 = roll(8);
  const det = (T.detail[d1-1] || [])[d2-1] || '无特殊细节';
  $('h-type').textContent = type;
  $('h-land').textContent = land;
  $('h-detail').textContent = det;
  return {type, land, det};
}
function rollHexes(){
  const n = parseInt($('hex-count').value)||5;
  let out = `=== 六角格 × ${n} ===\n\n`;
  for(let i=1;i<=n;i++){
    const h = rollHex();
    out += `${i}：${h.land}\n[${h.type} · ${h.det}]\n\n`;
  }
  $('hex-output').textContent = out;
}

// 定居点
function rollSettlement(){
  const s = Math.min(roll(6), roll(6));
  const gv = roll(6) + s;
  const govIdx = gv<=3?0 : gv<=5?1 : gv<=7?2 : gv<=9?3 : gv<=11?4 : 5;
  const vals = {
    scale: s, gov: govIdx,
    custom: roll(20), feature: roll(20), industry: roll(20), event: roll(20),
    nameA: roll(12), nameB: roll(12), suffix: roll(12),
    tavA: roll(12), tavB: roll(12), dish: roll(12)
  };
  $('s-scale').textContent = vals.scale; $('l-scale').textContent = T.scale[s-1];
  $('s-gov').textContent = gv; $('l-gov').textContent = T.gov[govIdx];
  $('s-custom').textContent = vals.custom; $('l-custom').textContent = T.custom[vals.custom-1];
  $('s-feature').textContent = vals.feature; $('l-feature').textContent = T.feature[vals.feature-1];
  $('s-industry').textContent = vals.industry; $('l-industry').textContent = T.industry[vals.industry-1];
  $('s-event').textContent = vals.event; $('l-event').textContent = T.event[vals.event-1];
  $('s-name').textContent = vals.nameA+'/'+vals.nameB; $('l-name').textContent = T.nameA[vals.nameA-1]+T.suffixA[vals.suffix-1] + ' 或 ' + T.nameB[vals.nameB-1]+T.suffixB[vals.suffix-1];
  $('s-tavern').textContent = vals.tavA+'/'+vals.tavB+'/'+vals.dish; $('l-tavern').textContent = T.tavernA[vals.tavA-1]+T.tavernB[vals.tavB-1]+'（'+T.dish[vals.dish-1]+'）';
  $('settle-output').textContent = `=== 定居点 ===\n\n规模：${T.scale[s-1]}\n治理：${T.gov[govIdx]}\n居民习俗：${T.custom[vals.custom-1]}\n显著特征：${T.feature[vals.feature-1]}\n产业：${T.industry[vals.industry-1]}\n当前事件：${T.event[vals.event-1]}\n命名：${T.nameA[vals.nameA-1]}${T.suffixA[vals.suffix-1]} / ${T.nameB[vals.nameB-1]}${T.suffixB[vals.suffix-1]}\n酒馆：${T.tavernA[vals.tavA-1]}${T.tavernB[vals.tavB-1]}（${T.dish[vals.dish-1]}）`;
}

// 季节
function seasonOf(){ return document.querySelector('input[name="season"]:checked').value; }
function rollSeason(){
  const s = seasonOf();
  const r = roll(6)+roll(6);
  const idx = r===2?0 : r<=5?1 : r<=8?2 : r<=11?3 : 4;
  $('w-dice').textContent = r;
  $('w-weather').textContent = T.weather[s][idx];
}
function rollSeasonEvent(){
  const s = seasonOf(), r = roll(6);
  $('w-event').textContent = r;
  $('l-event2').textContent = T.sevevent[s][r-1];
}
function rollRumor(){
  const r = roll(6);
  $('r-dice').textContent = r;
  $('r-text').textContent = r<=3?'真实':r<=5?'部分真实':'虚假';
}

// 钩子
function rollHook(){
  const r = roll(6);
  $('k-dice').textContent = r;
  $('k-text').textContent = T.hook[r-1];
  $('hook-output').textContent = `起始钩子：d6=${r} → ${T.hook[r-1]}`;
}

function copyOutput(id){
  navigator.clipboard.writeText($(id).textContent).then(()=>{
    const btn = event.target;
    const old = btn.textContent;
    btn.textContent = '已复制!';
    setTimeout(()=>btn.textContent=old, 1500);
  });
}
</script>
